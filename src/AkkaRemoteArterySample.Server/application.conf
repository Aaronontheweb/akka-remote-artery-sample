# Artery remoting over TCP (experimental in v1.6 beta).
# There is no Akka.Hosting helper for Artery yet, so we configure it via HOCON.
# Note the address scheme change: classic remoting uses akka.tcp://,
# Artery uses akka:// and defaults to port 25520.
akka {
  actor {
    provider = remote
  }

  remote {
    artery {
      enabled = on
      canonical {
        hostname = "localhost"
        port = 25520
      }
    }
  }
}
