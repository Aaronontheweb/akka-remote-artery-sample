# The client also enables Artery so it can talk to the server node using the
# same transport. Every node in a cluster/connection must use the same one;
# classic (akka.tcp://) and Artery (akka://) are not wire-compatible.
akka {
  actor {
    provider = remote
  }

  remote {
    artery {
      enabled = on
      canonical {
        hostname = "localhost"
        port = 25521
      }
    }
  }
}
